[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodewd"
version = "0.1.0"
description = "AI Flood Early-Warning Demo: CHIRPS + ML vs SCS-CN baseline (research prototype, in progress)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Mugabo", email = "joshuamugabo67@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "python-dotenv",
    "pydantic>=2",
]

[project.optional-dependencies]
ml = ["scipy", "scikit-learn", "xgboost", "torch", "matplotlib", "plotly"]
geo = [
    "earthengine-api",
    "geemap",
    "geopandas",
    "rasterio",
    "xarray",
    "rioxarray",
    "shapely",
    "pyproj",
]
api = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg2-binary", "geoalchemy2"]
iot = ["paho-mqtt"]
dev = ["pytest", "ruff"]
notebooks = ["jupyter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "dashboard", "firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
